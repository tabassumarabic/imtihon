<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabassum · A0 imtihon</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#17795E;--g2:#E6F4EE;--o:#F2A922;--k:#1F6FEB;--r:#D64545;--t:#1E2A28;--l:#D7E2DD}
*{box-sizing:border-box}html,body{margin:0;background:#F6F8F7;color:var(--t);font-family:Inter,system-ui,sans-serif}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--l);padding:8px 14px;display:flex;align-items:center;gap:10px}
.logo{font-family:'Noto Naskh Arabic',serif;font-weight:700;color:var(--g);font-size:26px;line-height:1}
.logo small{display:block;font-family:Inter;font-size:11px;color:var(--o);font-weight:700;letter-spacing:.5px}
header .ism{margin-inline-start:auto;font-size:13px;color:#5b6b66;text-align:end}
.pleer{position:sticky;top:58px;z-index:4;margin:8px 12px;background:#fff;border:1px solid var(--l);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px #0001}
.pleer button{width:40px;height:40px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:18px}
.pleer button:disabled{background:#B8C7C1}
.pleer .bar{flex:1;height:6px;background:#E3E9E6;border-radius:9px;position:relative}.pleer .bar i{position:absolute;inset:0 auto 0 0;background:var(--k);border-radius:9px;width:0}
.pleer .vq{font-size:13px;color:#5b6b66;min-width:88px;text-align:end}
main{padding:4px 12px 150px;max-width:760px;margin:auto}
.part{display:none}.part.on{display:block}
.ph{background:var(--g);color:#fff;border-radius:14px;padding:10px 14px;margin:8px 0 10px}
.ph b{font-size:17px}.ph div{font-size:14px;opacity:.9;margin-top:3px}
.ph .ar{font-size:19px;opacity:1}
.matn{background:#FFF8E8;border:1.5px solid #F4D79A;border-radius:14px;padding:12px 16px;font-size:23px;line-height:2;margin-bottom:10px}
.sv{background:#fff;border:1px solid var(--l);border-radius:14px;padding:10px 12px;margin-bottom:9px;scroll-margin-top:130px}
.sv .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;font-weight:700;margin-inline-end:8px;vertical-align:middle}
.sv .s{font-size:22px}
.op{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;direction:rtl}
.op label{flex:1 1 auto;min-width:80px;text-align:center;border:1.5px solid var(--l);border-radius:12px;padding:7px 10px;font-family:'Noto Naskh Arabic',serif;font-size:21px;cursor:pointer;background:#fff;user-select:none}
.op input{display:none}.op input:checked+span{color:var(--k);font-weight:700}
.op label:has(input:checked){border-color:var(--k);background:#EEF4FF}
.op label.tog{border-color:#2E9E5B!important;background:#E7F6EC!important}
.op label.xat{border-color:var(--r)!important;background:#FCEAEA!important}
.rg{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:560px){.rg{grid-template-columns:repeat(3,1fr)}}
.rg .sv{padding:8px;margin:0}
.rg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;margin:6px 0}
select{width:100%;font-family:'Noto Naskh Arabic',serif;font-size:20px;padding:5px;border:1.5px solid var(--l);border-radius:10px;direction:rtl;background:#fff}
select.tog{border-color:#2E9E5B;background:#E7F6EC}select.xat{border-color:var(--r);background:#FCEAEA}
.tj{font-size:14px;color:#2E9E5B;margin-top:4px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:6;padding:6px 8px 8px}
.nums{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;align-items:center}
.nums b{white-space:nowrap;font-size:15px;margin-inline-end:6px}
.nums button{min-width:38px;height:38px;border:1px solid var(--l);background:#fff;border-radius:8px;font-size:15px}
.nums button.ok{background:var(--k);color:#fff;border-color:var(--k)}
.nums button.tog{background:#2E9E5B;color:#fff;border-color:#2E9E5B}.nums button.xat{background:var(--r);color:#fff;border-color:var(--r)}
.parts{display:flex;gap:6px;align-items:center}
.parts button{flex:1;border:0;background:none;padding:8px 2px;font-size:14px;font-weight:600;color:#6b7a75;border-radius:8px}
.parts button.on{background:var(--g2);color:var(--g)}
.parts .chk{flex:1.6;background:var(--o);color:#fff}
.arr{position:fixed;bottom:108px;inset-inline-end:12px;display:flex;gap:8px;z-index:6}
.arr button{width:48px;height:44px;border:0;border-radius:10px;background:#333;color:#fff;font-size:22px}
.arr button:disabled{background:#ccc}
.ekran{position:fixed;inset:0;background:#0007;z-index:9;display:grid;place-items:center;padding:16px}
.ekran>div{background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%;text-align:center}
.ekran h2{margin:4px 0 10px;color:var(--g)}
.ekran input{width:100%;font-size:18px;padding:10px;border:1.5px solid var(--l);border-radius:10px;margin:8px 0}
.ekran .bt{width:100%;padding:12px;border:0;border-radius:12px;background:var(--g);color:#fff;font-size:17px;font-weight:700;margin-top:6px}
.ekran .bt.ik{background:#E3E9E6;color:var(--t)}
.ekran table{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}.ekran td{padding:6px;border-bottom:1px solid var(--l);text-align:start}.ekran td:last-child{text-align:end;font-weight:700}
.jami{font-size:38px;font-weight:800;color:var(--g)}
.muh{font-size:13px;color:#6b7a75}
</style></head><body>

<div class="pleer"><button id="play" disabled>▶</button><div class="bar"><i id="bar"></i></div><div class="vq" id="vq">🎧 ovoz tez orada</div></div>

function q(i,x){const n=`<span class="n">${i+1}</span>`;

 const L=D.q.map((x,i)=>[x,i]).filter(([x])=>x.p==p);

 h+='</section>';}
